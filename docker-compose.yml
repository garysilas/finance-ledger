services:
  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    container_name: ledger-postgres
    env_file:
      - path: .env.local
        required: true
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  ledger-pgdata:
